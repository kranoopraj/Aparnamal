<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Aparnamal • Upload</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f5f7fb,#eefbf3);color:#111827}
.card{width:min(100%,520px);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 24px 70px #10182812}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:#ecfdf3;color:#166534;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
h1{margin:16px 0 7px;font-size:30px;letter-spacing:-.03em}.sub{margin:0;color:#667085;line-height:1.5}
label{display:block;margin:22px 0 8px;font-size:13px;font-weight:750}
input[type=password]{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:13px;font:inherit;outline:none}
input[type=password]:focus{border-color:#86efac;box-shadow:0 0 0 4px #22c55e14}
.drop{display:block;border:1.5px dashed #98a2b3;border-radius:18px;background:#f8fafc;padding:24px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:#f0fdf4;border-color:#22c55e}.drop strong{display:block;font-size:15px;margin-bottom:5px}.drop span{font-size:13px;color:#667085}#file{display:none}
.file{display:none;margin-top:12px;padding:12px;border:1px solid #eaecf0;border-radius:13px;background:#f8fafc;justify-content:space-between;gap:12px;font-size:13px}.file.show{display:flex}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
button{width:100%;margin-top:18px;padding:13px 16px;border:0;border-radius:13px;background:#16a34a;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:hover{background:#15803d}button:disabled{opacity:.55;cursor:wait}
#status{display:none;margin-top:15px;padding:12px 14px;border-radius:13px;font-size:13px;line-height:1.5;font-weight:650}.show{display:block!important}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b42318}.info{background:#eff6ff;color:#1d4ed8}
.note{margin:18px 0 0;padding-top:15px;border-top:1px solid #eaecf0;color:#667085;font-size:11.5px;line-height:1.5}
a{color:inherit;font-weight:750}
</style>
</head>
<body>
<main class="card">
  <div class="badge">Aparnamal • GitHub Upload</div>
  <h1>Upload a file</h1>
  <p class="sub">Send a file directly to the <b>kranoopraj/Aparnamal</b> repository.</p>

  <label for="token">GitHub fine-grained token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Repository access token">

  <label>Choose file</label>
  <label id="drop" class="drop" for="file">
    <strong>Tap to choose a file</strong>
    <span>Or drag a file onto this box.</span>
    <input id="file" type="file">
  </label>

  <div id="fileBox" class="file"><span id="fileName" class="name"></span><span id="fileSize"></span></div>

  <button id="btn" type="button">Upload to Aparnamal</button>
  <div id="status"></div>

  <p class="note"><b>Security:</b> the token is used only for this browser request and is not stored by this page. Use a fine-grained token limited to this repository with <b>Contents: Read and write</b>.</p>
</main>

<script>
const REPO_OWNER="kranoopraj", REPO_NAME="Aparnamal", FOLDER="uploads";
const fileInput=document.getElementById("file"), drop=document.getElementById("drop"), fileBox=document.getElementById("fileBox");
const fileName=document.getElementById("fileName"), fileSize=document.getElementById("fileSize"), tokenInput=document.getElementById("token");
const btn=document.getElementById("btn"), statusBox=document.getElementById("status");

function size(n){if(n<1024)return n+" B";let v=n/1024;if(v<1024)return v.toFixed(1)+" KB";v/=1024;if(v<1024)return v.toFixed(1)+" MB";return (v/1024).toFixed(1)+" GB"}
function setStatus(msg,type,link){statusBox.className="show "+type;statusBox.innerHTML=msg+(link?' <a target="_blank" rel="noopener" href="'+link+'">View on GitHub ↗</a>':'')}
function pick(file){if(!file){fileBox.classList.remove("show");return}fileName.textContent=file.name;fileSize.textContent=size(file.size);fileBox.classList.add("show")}
function safeName(n){const x=n.replace(/[^\w.()\[\]-]+/g,"_").replace(/\s+/g," ").trim();return x||"upload.bin"}
fileInput.addEventListener("change",()=>pick(fileInput.files[0]));
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(!f)return;const dt=new DataTransfer();dt.items.add(f);fileInput.files=dt.files;pick(f)});

function readBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error("Could not read the file."));r.onload=()=>{const s=String(r.result||"");const i=s.indexOf(",");if(i<0)reject(new Error("Could not encode the file."));else resolve(s.slice(i+1))};r.readAsDataURL(file)})}

btn.addEventListener("click",async()=>{
 const file=fileInput.files[0], token=tokenInput.value.trim();
 if(!file||!token){setStatus("Please select a file and enter the GitHub token.","err");return}
 btn.disabled=true;setStatus("Uploading…","info");
 try{
  const content=await readBase64(file), name=Date.now()+"_"+safeName(file.name);
  const url=`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER}/${encodeURIComponent(name)}`;
  const res=await fetch(url,{method:"PUT",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2026-03-10","Content-Type":"application/json"},body:JSON.stringify({message:"Upload "+name+" via Aparnamal web uploader",content})});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){setStatus("Upload failed: "+(data.message||("HTTP "+res.status)),"err");return}
  setStatus("Upload successful 🎉","ok",data?.content?.html_url||"");
  fileInput.value="";fileBox.classList.remove("show");
 }catch(e){setStatus("Network/browser error: "+e.message,"err")}
 finally{btn.disabled=false}
});
</script>
</body>
</html>
