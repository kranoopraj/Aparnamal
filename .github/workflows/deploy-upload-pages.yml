name: Deploy Aparnamal Upload Page

on:
  push:
    branches: [main]
    paths:
      - "pages-upload/**"
      - ".github/workflows/deploy-upload-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-upload"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./pages-upload"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
