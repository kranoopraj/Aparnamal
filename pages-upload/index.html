<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Aparnamal — Upload</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#111827;--muted:#667085;--line:#d0d5dd;--green:#16a34a;--green2:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 0 0,#dcfce7 0,transparent 34%),radial-gradient(circle at 100% 100%,#dbeafe 0,transparent 34%),var(--bg);color:var(--ink)}
.card{width:min(100%,520px);background:var(--card);border:1px solid #e4e7ec;border-radius:22px;padding:26px;box-shadow:0 20px 50px rgba(16,24,40,.1)}
.header{display:flex;gap:14px;align-items:center;margin-bottom:24px}.mark{width:48px;height:48px;border-radius:15px;background:#111827;color:#fff;display:grid;place-items:center;font-size:24px}.title{margin:0;font-size:1.35rem}.sub{margin:4px 0 0;color:var(--muted);font-size:.92rem}
label{display:block;margin:16px 0 7px;font-size:.86rem;font-weight:700}.repo{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#f8fafc;color:#475467;font-size:.9rem}
.drop{border:1.5px dashed #98a2b3;border-radius:16px;padding:22px 16px;text-align:center;background:#f8fafc;cursor:pointer}.drop:hover{border-color:#86efac;background:#f0fdf4}.drop strong{display:block;margin-bottom:5px}.drop span{color:var(--muted);font-size:.84rem}.drop input{display:none}
.file{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:#f8fafc;border:1px solid #eaecf0;gap:10px;justify-content:space-between;font-size:.87rem}.file.on{display:flex}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{width:100%;margin-top:18px;padding:13px 16px;border:0;border-radius:13px;background:var(--green);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:hover{background:var(--green2)}button:disabled{opacity:.55;cursor:wait}
.status{display:none;margin-top:15px;padding:12px 14px;border-radius:12px;font-size:.9rem;line-height:1.45;font-weight:650}.status.on{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef3f2;color:#b42318}.info{background:#eff6ff;color:#1d4ed8}.link{color:#166534;word-break:break-all}.note{margin:18px 0 0;padding-top:15px;border-top:1px solid #eaecf0;color:var(--muted);font-size:.76rem;line-height:1.55}@media(max-width:480px){body{padding:12px}.card{padding:20px;border-radius:18px}}
</style>
</head>
<body>
<main class="card">
<div class="header"><div class="mark">↥</div><div><h1 class="title">Aparnamal File Upload</h1><p class="sub">Send a file to the Aparnamal repo.</p></div></div>
<label>Storage repository</label>
<div class="repo">kranoopraj/Aparnamal → <b>uploads/</b></div>
<label>File</label>
<label class="drop" for="file"><strong>Choose a file or drag it here</strong><span>Your file will be saved under <b>uploads/</b>.</span><input id="file" type="file"></label>
<div id="fileBox" class="file"><span id="fileName" class="name"></span><span id="fileSize"></span></div>
<button id="upload" type="button">Upload</button>
<div id="status" class="status"></div>
<p class="note"><b>Note:</b> anyone with this link can upload a file here. Uploads are handled by a server-side proxy — no credentials are ever exposed in this page.</p>
</main>
<script>
// Replace with your deployed Worker URL, e.g. https://aparnamal-upload.<your-subdomain>.workers.dev
const WORKER_URL = 'https://aparnamal-upload.YOUR-SUBDOMAIN.workers.dev';

const fileInput=document.getElementById('file'),fileBox=document.getElementById('fileBox'),fileName=document.getElementById('fileName'),fileSize=document.getElementById('fileSize'),status=document.getElementById('status'),button=document.getElementById('upload');
function size(n){if(n<1024)return n+' B';const u=['KB','MB','GB'];let v=n/1024,i=0;while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(v>=10?0:1)+' '+u[i]}
function show(msg,type){status.className='status on '+type;status.innerHTML=msg}
function setFile(f){if(!f){fileBox.classList.remove('on');return}fileName.textContent=f.name;fileSize.textContent=size(f.size);fileBox.classList.add('on')}
fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
document.querySelector('.drop').addEventListener('dragover',e=>{e.preventDefault();document.querySelector('.drop').style.borderColor='#16a34a'});
document.querySelector('.drop').addEventListener('dragleave',()=>document.querySelector('.drop').style.borderColor='#98a2b3');
document.querySelector('.drop').addEventListener('drop',e=>{e.preventDefault();document.querySelector('.drop').style.borderColor='#98a2b3';const f=e.dataTransfer.files[0];if(!f)return;const dt=new DataTransfer();dt.items.add(f);fileInput.files=dt.files;setFile(f)});
function b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read the file.'));r.onload=()=>{const s=String(r.result||''),i=s.indexOf(',');if(i<0)rej(new Error('Could not encode the file.'));else res(s.slice(i+1))};r.readAsDataURL(file)})}
button.addEventListener('click',async()=>{
const f=fileInput.files[0];
if(!f){show('Please choose a file.','error');return}
button.disabled=true;show('Uploading…','info');
try{
const content=await b64(f);
const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,content})});
let d={};try{d=await r.json()}catch{}
if(!r.ok){show('Upload failed: '+(d.error||('HTTP '+r.status)),'error');return}
show('Upload successful 🎉'+(d.url?'<br><a class="link" target="_blank" rel="noopener" href="'+d.url.replace(/"/g,'&quot;')+'">View uploaded file</a>':''),'success');
}catch(e){show('Network or browser error: '+(e.message||'unknown error'),'error')}
finally{button.disabled=false}
});
</script>
</body>
</html>
